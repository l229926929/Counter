<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>计数器</title>
</head>

<style>
  html,body {
    height: 100%;
    width: 100%;
    margin: 0;
    padding: 0;
    background: linear-gradient(135deg, #ff5f6d 0%, #ffc371 100%);
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    font-family: '微软雅黑', sans-serif;
  }

  p {
    height: 70px;
    font-size: 60px;
    color: rgba(255, 255, 255, 0.9);
    line-height: 70px;
    text-align: center;
    font-weight: bold;
  }

  .card {
    background: rgba(243, 240, 240, 0.25);
    backdrop-filter: blur(30px);
    border-radius: 20px;
    width: 400px;
    height: 300px;
    margin: 200px auto;
    padding: 20px;
    box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
    text-align: center;
  }

  .button {
    font-size: 20px;
    width: 150px;
    height: 80px;
    padding: 10px, 20px;
    background: rgba(255, 255, 255, 0.2);
    color: white;
    border: none;
    cursor: pointer;
    border-radius: 20px 20px 20px 20px;
    transition: background-color 0.3s;
  }

  .button:hover {
    background-color: darken(var(--primary-color), 10%);
  }

  .button:hover {
    background-color: #f5eb90;
  }

  .input-group {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    gap: 40px;
  }
</style>

<body>
  <div class="card">
    <p id="num">0</p>
    <span class="input-group">
      <button class="button">计数+1</button>
      <button class="button">更换背景</button>
    </span>
  </div>

  <script src="counter.js"></script>
</body>

</html>
